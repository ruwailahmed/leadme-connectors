<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>leadme console — conversation intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c8cff'/%3E%3C/svg%3E">
<style>
:root{--bg:#090c0a;--panel:#0e1310;--panel2:#131a15;--line:#1f2a22;--tx:#e6efe3;--mut:#7f8f84;--acc:#9bd23c;--acc2:#6fa12a;--ok:#9bd23c;--warn:#e6b422;--bad:#f0645c;--slack:#4a154b;--discord:#5865f2;color-scheme:dark}
.mono,h1,.nav,.badge,.tabs button,.pill,label.f,.steps+h2{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--acc)}
.app{display:block;min-height:100vh}
aside{border-bottom:1px solid var(--line);padding:10px 28px;background:var(--panel);position:sticky;top:0;z-index:5;display:flex;flex-direction:row;align-items:center;gap:6px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;padding:0 22px 0 0;display:flex;gap:9px;align-items:center}
.logo i{width:24px;height:24px;border-radius:6px;background:var(--acc);display:inline-block}
.nav{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;border:0;background:none;text-align:left;color:var(--mut);font-weight:500}
.nav:hover{background:var(--panel2);color:var(--tx)}.nav.on{background:var(--panel2);color:var(--tx)}
.badge{background:var(--acc);color:#0b1405;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.sidefoot{margin-left:auto;color:var(--mut);font-size:12px;display:flex;gap:12px;align-items:center}.sidefoot br{display:none}
main{padding:28px 34px 60px;max-width:1180px;width:100%;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat b{display:block;font-size:24px;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:600}.btn:hover{border-color:var(--acc)}
.btn.pri{background:#4d6d1f;border:1px solid #6c9a2c;color:#ecf7d8}.btn.pri:hover{background:#5a7f26}.btn.sm{padding:4px 10px;font-size:12px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.healthy .dot,.listening .dot{background:var(--ok);box-shadow:0 0 0 3px #9bd23c22}.degraded .dot{background:var(--warn)}.disconnected .dot,.bad_match .dot{background:var(--bad)}.paused .dot,.draft .dot{background:var(--mut)}
.plat{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff}.plat.slack{background:#611f69}.plat.discord{background:var(--discord)}
.mut{color:var(--mut)}.small{font-size:12px}
.ws{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;margin-top:8px}.ws:hover{border-color:var(--acc)}
.ws.on{border-color:var(--acc)}.ws .ic{font-size:20px}
.chlist{max-height:220px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
.ch{display:flex;gap:9px;align-items:center;padding:7px 11px;border-bottom:1px solid var(--line);cursor:pointer}.ch:last-child{border:0}.ch:hover{background:var(--panel2)}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 11px;font:inherit}
.pwrap{position:relative}.pwrap input{padding-right:36px}
.pweye{position:absolute;right:4px;top:4px;bottom:4px;width:30px;background:none;border:0;cursor:pointer;color:var(--mut);font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:6px}.pweye:hover{background:var(--line);color:var(--tx)}
textarea{min-height:86px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--acc)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.opt{display:flex;gap:8px;flex-wrap:wrap}.opt button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel2)}.opt button.on{border-color:var(--acc);background:#9bd23c22}
.alert{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}.alert.new{border-left:3px solid var(--acc)}
.alert .msg{background:var(--panel2);border-radius:10px;padding:11px 13px;margin:10px 0;white-space:pre-wrap;word-break:break-word}
.why{color:var(--ok);font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 14px}.tabs button.on{border-color:var(--acc);background:#9bd23c22}
.empty{text-align:center;color:var(--mut);padding:46px 10px;border:1px dashed var(--line);border-radius:14px}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}.verdict.y{border-color:var(--ok);background:#9bd23c14}.verdict.n{border-color:var(--bad);background:#f8717114}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}.t{background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:11px 14px;max-width:340px;box-shadow:0 8px 30px #0006;animation:in .25s}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.banner{background:#fbbf2418;border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px}
@media(max-width:800px){aside{flex-wrap:wrap;padding:10px 14px}.sidefoot{display:none}main{padding:18px}}
.prov{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);text-align:left;font-weight:600}.prov:hover{border-color:var(--acc)}.prov .arrow{margin-left:auto;color:var(--mut)}
.k{font:12px ui-monospace,Menlo,monospace;color:var(--acc);letter-spacing:.08em;text-transform:uppercase}
code.cp{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-all;font:12px ui-monospace,Menlo,monospace;cursor:copy}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i></i>leadme</div>
    <button class="nav on" data-v="connections">Connections</button>
    <button class="nav" data-v="monitors">Monitors</button>
    <button class="nav" data-v="alerts">Alerts <span class="badge" id="unread" hidden>0</span></button>
    <div class="sidefoot"><span class="mono">leadme~$ monitoring workspace ready</span><button class="btn sm" id="engine" onclick="aiModal()"></button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pf=(id,ph,style)=>`<div class="pwrap" ${style?`style="${style}"`:''}><input type="password" id="${id}" placeholder="${esc(ph)}" autocomplete="off"><button type="button" class="pweye" tabindex="-1" onclick="togglePw('${id}',this)">👁</button></div>`;
function togglePw(id,btn){const i=document.getElementById(id);if(!i)return;const hidden=i.type==='password';i.type=hidden?'text':'password';btn.textContent=hidden?'🙈':'👁'}
async function api(path,opt={}){const r=await fetch('/api'+path,{headers:{'content-type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
const S={view:'connections',accounts:[],monitors:[],alerts:[],stats:{},filter:'new',open:{}};
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const pill=(s,txt)=>`<span class="pill ${s}"><i class="dot"></i>${esc(txt||s.replace('_',' '))}</span>`;
function toast(h){const e=document.createElement('div');e.className='t';e.innerHTML=h;$('#toast').append(e);setTimeout(()=>e.remove(),6000)}
function modal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});

let load=async function load(){
  [S.accounts,S.monitors,S.alerts,S.stats]=await Promise.all([api('/accounts'),api('/monitors'),api('/alerts'+(S.filter?`?status=${S.filter}`:'')),api('/stats')]);
  $('#unread').hidden=!S.stats.unread;$('#unread').textContent=S.stats.unread;
  api('/ai').then(a=>{$('#engine').textContent=a.connected?`● AI: ${a.method}${a.plan?' ('+a.plan+')':''}`:'○ AI not connected — set up'}).catch(()=>{});
  render();
}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===S.view));({connections:rConn,monitors:rMon,alerts:rAlerts})[S.view]()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{S.view=n.dataset.v;load()});

const statsBar=()=>`<div class="stats"><div class="stat"><b>${S.stats.healthy}/${S.stats.accounts}</b><span>accounts healthy</span></div><div class="stat"><b>${S.stats.listening}</b><span>monitors listening</span></div><div class="stat"><b>${S.stats.channels}</b><span>channels watched</span></div><div class="stat"><b>${S.stats.alerts}</b><span>leads captured</span></div></div>`;

/* ---------- Connections ---------- */
function rConn(){
  const degraded=S.accounts.filter(a=>a.status!=='healthy');
  $('#main').innerHTML=`<div class="row"><div><div class="k">// Connected sources</div><h1>Source accounts</h1><p class="sub">Connect an account, then choose the exact conversations leadme may monitor.</p></div><div class="sp"></div><button class="btn pri" onclick="connectModal()">+ Connect account</button></div>${statsBar()}
  ${degraded.map(a=>`<div class="banner">⚠️ <b>${esc(a.label)}</b> (${a.platform}) is ${a.status}${a.statusNote?': '+esc(a.statusNote):''}. <button class="btn sm" onclick="reconnect('${a.id}')">Reconnect</button></div>`).join('')}
  ${S.accounts.length?`<div class="grid">${S.accounts.map(accCard).join('')}</div>`:`<div class="empty">No accounts yet. Connect Slack or Discord to get started.</div>`}`;
  S.accounts.forEach(a=>{if(S.open[a.id])browse(a.id,false)});
}
const accCard=a=>`<div class="card" id="acc-${a.id}"><div class="row"><div class="plat ${a.platform}">${a.platform==='slack'?'S':'D'}</div><div><b>${esc(a.label)}</b><div class="mut small">${esc(a.email)} · ${a.mode==='demo'?'demo data':'live'}</div></div><div class="sp"></div>${pill(a.status)}</div>
<div class="row" style="margin-top:12px"><button class="btn sm" onclick="browse('${a.id}',true)">${S.open[a.id]?'Hide':'Browse'} workspaces</button>${a.mode==='demo'?`<button class="btn sm" onclick="simulate('${a.id}','${a.status==='healthy'?'disconnected':'healthy'}')">${a.status==='healthy'?'Simulate drop':'Restore'}</button>`:''}<div class="sp"></div><button class="btn sm danger" onclick="removeAcc('${a.id}')">Remove</button></div><div class="mut small" style="margin-top:8px">Last sync ${a.lastSync?ago(a.lastSync):'—'}</div><div id="ws-${a.id}"></div></div>`;
async function browse(id,toggle){
  if(toggle)S.open[id]=!S.open[id];const box=$('#ws-'+id);if(!box)return;
  if(!S.open[id]){box.innerHTML='';return}
  box.innerHTML='<div class="mut small" style="margin-top:10px">Loading workspaces…</div>';
  try{const ws=await api(`/accounts/${id}/workspaces`);S.ws=S.ws||{};ws.forEach(w=>S.ws[id+w.id]=w);
    box.innerHTML=ws.map(w=>`<div class="ws" onclick="chans('${id}','${esc(w.id)}',this)"><span class="ic">${esc(w.icon)}</span><div><b>${esc(w.name)}</b><div class="mut small">${w.members?w.members.toLocaleString()+' members':'member'}${w.needsBot?' · bot not invited':''}</div></div></div><div id="ch-${id}-${esc(w.id)}"></div>`).join('')||'<div class="mut small">No workspaces.</div>'}
  catch(e){box.innerHTML=`<div class="banner">${esc(e.message)}</div>`}
}
async function chans(id,wid,el){const box=document.getElementById(`ch-${id}-${wid}`);if(box.innerHTML){box.innerHTML='';return}
  const w=(S.ws||{})[id+wid]||{};
  try{const cs=await api(`/accounts/${id}/workspaces/${wid}/channels`);box.innerHTML=`<div class="chlist">${cs.map(c=>`<div><div class="ch" onclick="showMsgs('${id}','${esc(wid)}','${esc(c.id)}')"><span class="mut">${c.kind==='im'||c.kind==='mpim'?'✉️':'#'}</span>${esc(c.name)}<div class="sp"></div><span class="mut small">${c.members?c.members.toLocaleString():'view messages ›'}</span></div><div id="m-${esc(c.id)}"></div></div>`).join('')||'<div class="ch mut">No channels found.</div>'}</div>`}
  catch(e){const nb=/bot_not_in_server/.test(e.message)||w.needsBot;box.innerHTML=nb?`<div class="banner">Discord only lets a bot read a server\'s messages, and the bot is not in <b>${esc(w.name||'this server')}</b> yet. <button class="btn sm pri" onclick="inviteBot('${esc(wid)}')">Invite bot</button> <span class="mut small">(needs Manage Server)</span></div>`:`<div class="banner">${esc(e.message)}</div>`}}
async function inviteBot(g){const r=await api('/discord/invite?guild='+encodeURIComponent(g));window.open(r.url,'_blank','noopener')}
async function showMsgs(id,wid,cid){const box=document.getElementById('m-'+cid);if(box.innerHTML){box.innerHTML='';return}box.innerHTML='<div class="small mut" style="padding:8px 11px">Pulling messages…</div>';
  try{const ms=await api(`/accounts/${id}/workspaces/${wid}/channels/${cid}/messages`);box.innerHTML=ms.length?ms.map(m=>`<div style="padding:8px 11px;border-top:1px solid var(--line);background:var(--panel2)"><div class="small"><b>${esc(m.author.name)}</b> <span class="mut">${ago(m.ts)}</span></div><div class="small" style="white-space:pre-wrap;word-break:break-word">${esc(m.text)}</div></div>`).join(''):'<div class="small mut" style="padding:8px 11px">No recent messages.</div>'}catch(e){box.innerHTML=`<div class="small" style="padding:8px 11px;color:var(--bad)">${esc(e.message)}</div>`}}
async function connectModal(){
  const oc=await api('/oauth/config').catch(()=>({}));
  modal(`<div class="row"><h2 style="margin:0">Choose a source account</h2><div class="sp"></div><button class="btn sm" onclick="closeModal()">✕</button></div>
  <p class="mut">You'll continue through the provider's secure authentication flow.</p>
  <div style="display:grid;gap:10px"><button class="prov" onclick="startConnect('slack')"><span class="plat slack">S</span>Slack<span class="arrow">›</span></button><button class="prov" onclick="startConnect('discord')"><span class="plat discord">D</span>Discord<span class="arrow">›</span></button></div>
  <p class="small mut" style="margin-top:16px">${oc.slack||oc.discord?'You approve access on the provider\'s own page and land back here connected.':'First time: a one-time 2-minute setup connects leadme to Slack/Discord, then it is one click.'}<br><a href="#" onclick="demoAcc();return false">Or load demo data</a></p>`)}
async function startConnect(p){const oc=await api('/oauth/config');if(oc[p])return void(location='/oauth/'+p+'/start');setupModal(p,oc)}
function slackSessionModal(){
  modal(`<div class="k">// Your own session · your own workspace</div><h2 style="margin:4px 0 10px">Use your Slack session</h2>
  <div class="banner">Skips the Slack app entirely — this is <b>your personal login</b>, not a scoped connection. Anything holding it can read your DMs and private channels and post as you, in <b>any</b> workspace it's valid for, not just the one you mean to demo. Slack bans accounts for this. Use it only on a workspace you own and don't mind losing.</div>
  <label class="f">1. In your own browser, open Slack and sign in to the workspace</label>
  <label class="f">2. Open DevTools (⌥⌘I) → Network tab, click around in Slack, find any request to slack.com/api/* → copy its <b>token</b> form field (starts <code>xoxc-</code>)</label>
  <input type="text" id="sxt" placeholder="xoxc-… token" autocomplete="off">
  <label class="f">3. Same DevTools → Application → Cookies → app.slack.com → copy the value of the <b>d</b> cookie (starts <code>xoxd-</code>)</label>
  ${pf('sxc','d cookie value')}
  <label class="f">Label</label><input type="text" id="sxl" placeholder="e.g. Demo workspace">
  <p id="sxerr" class="small" style="color:var(--bad)"></p>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="setupModal('slack',{})">Back</button><div class="sp"></div><button class="btn pri" id="sxgo">Connect</button></div>`);
  $('#sxgo').onclick=async()=>{try{$('#sxgo').disabled=true;await api('/accounts',{method:'POST',body:{platform:'slack',mode:'live',label:$('#sxl').value||'Slack (session)',token:$('#sxt').value.trim(),sessionCookie:$('#sxc').value.trim()}});closeModal();load()}catch(e){$('#sxerr').textContent=e.message;$('#sxgo').disabled=false}}}
function cp(el){navigator.clipboard?.writeText(el.textContent);toast('Copied')}
function setupModal(p,oc){
  const base=oc.baseUrl,redir=`${base}/oauth/${p}/callback`;
  if(p==='slack'){const manifest={display_information:{name:'leadme'},oauth_config:{redirect_urls:[redir],scopes:{user:oc.slackScopes.split(',')}},settings:{org_deploy_enabled:false,socket_mode_enabled:false,token_rotation_enabled:false}};
    modal(`<div class="k">// One-time setup · Slack</div><h2 style="margin:4px 0 14px">Connect leadme to Slack</h2>
    <p><b>1.</b> <a class="btn sm pri" target="_blank" rel="noopener" href="https://api.slack.com/apps?new_app=1&manifest_json=${encodeURIComponent(JSON.stringify(manifest))}">Create the Slack app (pre-filled)</a> <span class="mut small">choose a workspace, click Create</span></p>
    <p><b>2.</b> On that app's <i>Basic Information</i> page, copy the <b>Client ID</b> and <b>Client Secret</b> here:</p>
    <input type="text" id="sid" placeholder="Client ID" autocomplete="off">${pf('ssec','Client Secret','margin-top:8px')}
    <p id="serr" class="small" style="color:var(--bad)"></p><div class="row"><div class="sp"></div><button class="btn" onclick="connectModal()">Back</button><button class="btn pri" id="sgo">Save &amp; continue to Slack</button></div>
    <p class="small mut" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">Demoing on your own workspace and OK skipping this for now? <a href="#" onclick="slackSessionModal();return false">Use your Slack session instead</a>.</p>`);
    $('#sgo').onclick=async()=>{try{await api('/oauth/settings',{method:'PUT',body:{SLACK_CLIENT_ID:$('#sid').value,SLACK_CLIENT_SECRET:$('#ssec').value}});location='/oauth/slack/start'}catch(e){$('#serr').textContent=e.message}}}
  else modal(`<div class="k">// One-time setup · Discord</div><h2 style="margin:4px 0 14px">Connect leadme to Discord</h2>
    <p><b>1.</b> <a class="btn sm pri" target="_blank" rel="noopener" href="https://discord.com/developers/applications">Open Discord Developer Portal</a> → New Application → <i>OAuth2</i>. Add this redirect:</p><code class="cp" onclick="cp(this)">${esc(redir)}</code>
    <p><b>2.</b> Paste the app's <b>Client ID</b> and <b>Client Secret</b> (OAuth2 page), and the <b>Bot token</b> (Bot page, and turn on <b>Message Content Intent</b> there):</p>
    <input type="text" id="did" placeholder="Client ID" autocomplete="off">${pf('dsec','Client Secret','margin-top:8px')}${pf('dbot','Bot token','margin-top:8px')}
    <p id="derr" class="small" style="color:var(--bad)"></p><div class="row"><div class="sp"></div><button class="btn" onclick="connectModal()">Back</button><button class="btn pri" id="dgo">Save &amp; continue to Discord</button></div>
    <p class="small mut" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">No bot, no server admin involved? <a href="#" onclick="discordSessionModal();return false">Use your Discord account directly</a>.</p>`),
    $('#dgo').onclick=async()=>{try{await api('/oauth/settings',{method:'PUT',body:{DISCORD_CLIENT_ID:$('#did').value,DISCORD_CLIENT_SECRET:$('#dsec').value,DISCORD_BOT_TOKEN:$('#dbot').value}});location='/oauth/discord/start'}catch(e){$('#derr').textContent=e.message}}}
function discordSessionModal(){
  modal(`<div class="k">// Your own account · no bot, no admin</div><h2 style="margin:4px 0 10px">Use your Discord account directly</h2>
  <div class="banner">This is <b>your personal Discord login</b>, not a scoped app connection — it reads (and can post as) everything your account can, in every server it's in. Discord explicitly bans this ("self-botting") and enforces it harder than Slack, sometimes at the device level. Use it only on an account you're fine losing.</div>
  <label class="f">1. In your own browser, open Discord (discord.com/app) and sign in</label>
  <label class="f">2. DevTools (⌥⌘I) → Network tab → click around (open a server) → find any request to discord.com/api/* → copy its <b>Authorization</b> request header value</label>
  ${pf('dxt','Your Discord token')}
  <label class="f">Label</label><input type="text" id="dxl" placeholder="e.g. Demo Discord">
  <p id="dxerr" class="small" style="color:var(--bad)"></p>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="setupModal('discord',{})">Back</button><div class="sp"></div><button class="btn pri" id="dxgo">Connect</button></div>`);
  $('#dxgo').onclick=async()=>{try{$('#dxgo').disabled=true;await api('/accounts',{method:'POST',body:{platform:'discord',mode:'live',label:$('#dxl').value||'Discord (session)',selfToken:$('#dxt').value.trim()}});closeModal();load()}catch(e){$('#dxerr').textContent=e.message;$('#dxgo').disabled=false}}}
async function demoAcc(){for(const p of ['slack','discord'])await api('/accounts',{method:'POST',body:{platform:p,mode:'demo',label:p==='slack'?'Demo Slack':'Demo Discord',email:'demo@leadme.app'}});closeModal();load()}
const simulate=async(id,status)=>{await api(`/accounts/${id}/simulate`,{method:'POST',body:{status}});load()};
const reconnect=async id=>{await api(`/accounts/${id}/reconnect`,{method:'POST'});load()};
const removeAcc=async id=>{if(confirm('Remove this account and detach it from monitors?')){await api('/accounts/'+id,{method:'DELETE'});load()}};

/* ---------- Monitors ---------- */
function rMon(){$('#main').innerHTML=`<div class="row"><div><h1>Monitors</h1><p class="sub">Describe a lead in plain English. One monitor can watch Slack and Discord together.</p></div><div class="sp"></div><button class="btn pri" onclick="wizard()">+ New monitor</button></div>
${S.monitors.length?`<div class="grid">${S.monitors.map(m=>`<div class="card"><div class="row"><b>${esc(m.name)}</b><div class="sp"></div>${pill(m.status,m.status==='listening'?'Listening':m.status)}</div><p class="mut small">${esc(m.criteria?.summary||m.description)}</p>
<div class="row small mut"><span>${m.targets.length} channels</span><span>·</span><span>${m.matches} matches</span></div>
<div class="row" style="margin-top:12px">${m.status==='listening'?`<button class="btn sm" onclick="act('${m.id}','pause')">Pause</button>`:m.criteria&&m.targets.length?`<button class="btn sm pri" onclick="act('${m.id}','deploy')">Deploy</button>`:`<button class="btn sm" onclick="wizard('${m.id}')">Finish setup</button>`}<button class="btn sm" onclick="wizard('${m.id}')">Edit / test</button><div class="sp"></div><button class="btn sm danger" onclick="delMon('${m.id}')">Delete</button></div></div>`).join('')}</div>`:`<div class="empty">No monitors yet. Create one to start catching leads.</div>`}`}
const act=async(id,a)=>{try{await api(`/monitors/${id}/${a}`,{method:'POST'});load()}catch(e){toast(esc(e.message))}};
const delMon=async id=>{if(confirm('Delete this monitor?')){await api('/monitors/'+id,{method:'DELETE'});load()}};

const W={step:0,mon:null,questions:[],answers:{},targets:[]};
async function wizard(id){W.step=id?2:0;W.mon=id?S.monitors.find(m=>m.id===id):null;W.answers={};W.targets=W.mon?[...W.mon.targets]:[];W.cache={};wstep()}
const steps=n=>`<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
function wstep(){
  if(W.step===0)return modal(`${steps(0)}<h2 style="margin:0 0 4px">What are you looking for?</h2><p class="mut">Plain English. Example: <i>people requesting LinkedIn account rentals for outbound that are US ID verified</i></p><textarea id="wd" placeholder="Describe the lead…"></textarea><p id="werr" class="small" style="color:var(--bad)"></p><div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="w0()">Continue</button></div>`);
  if(W.step===1)return modal(`${steps(1)}<h2 style="margin:0 0 4px">A few quick questions</h2><p class="mut">So the filter is exactly right.</p>${W.questions.map(q=>`<label class="f">${esc(q.q)}</label><div class="opt" data-q="${q.id}">${q.options.map((o,i)=>`<button class="${(W.answers[q.id]===undefined?i===0:W.answers[q.id]===o.value)?'on':''}" data-v='${JSON.stringify(o.value)}'>${esc(o.label)}</button>`).join('')}</div>`).join('')}<div class="row" style="margin-top:22px"><div class="sp"></div><button class="btn pri" onclick="w1()">Confirm understanding</button></div>`),
    document.querySelectorAll('.opt[data-q] button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  if(W.step===2)return modal(`${steps(2)}<h2 style="margin:0 0 4px">Here's what I understood</h2><div class="verdict y" style="margin-bottom:6px">${esc(W.mon.criteria?.summary||'')}</div>
  <label class="f">Test it — paste a real message</label><textarea id="wt" placeholder="Paste a message…"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="wtest()">Run test</button><button class="btn" onclick="wreplay()">Replay against history</button></div><div id="wres"></div>
  <div class="row" style="margin-top:22px"><div class="sp"></div><button class="btn pri" onclick="w2()">Choose where to listen →</button></div>`);
  if(W.step===3)return wTargets();
}
async function w0(){try{const d=$('#wd').value;const r=await api('/monitors',{method:'POST',body:{description:d}});W.mon=r.monitor;W.questions=r.questions;W.step=1;wstep()}catch(e){$('#werr').textContent=e.message}}
async function w1(){const answers={};document.querySelectorAll('.opt[data-q]').forEach(g=>answers[g.dataset.q]=JSON.parse(g.querySelector('.on').dataset.v));W.mon=await api(`/monitors/${W.mon.id}/confirm`,{method:'POST',body:{answers}});W.step=2;wstep()}
async function wtest(){const t=$('#wt').value.trim();if(!t)return;$('#wres').innerHTML='<p class="mut">Testing…</p>';const v=await api(`/monitors/${W.mon.id}/test`,{method:'POST',body:{text:t}});$('#wres').innerHTML=`<div class="verdict ${v.match?'y':'n'}"><b>${v.match?'✅ Match':'❌ No match'}</b> — ${esc(v.reason)}</div>`}
async function wreplay(){$('#wres').innerHTML='<p class="mut">Replaying…</p>';const r=await api(`/monitors/${W.mon.id}/replay`,{method:'POST'});$('#wres').innerHTML=`<div class="verdict y"><b>${r.matches} of ${r.scanned} past messages would have matched</b></div>${r.results.slice(0,4).map(x=>`<div class="alert"><div class="small mut">${esc(x.message.workspace)} #${esc(x.message.channel)} · ${esc(x.message.author.name)}</div><div class="msg">${esc(x.message.text)}</div><div class="why">${esc(x.reason)}</div></div>`).join('')}`}
async function w2(){W.step=3;wstep()}
async function wTargets(){
  modal(`${steps(3)}<h2 style="margin:0 0 4px">Choose where to listen</h2><p class="mut">Pick channels across any account — Slack and Discord together.</p><div id="tp" class="mut">Loading…</div><div class="row" style="margin-top:20px"><span class="mut small" id="tc"></span><div class="sp"></div><button class="btn" onclick="wsave(false)">Save</button><button class="btn pri" onclick="wsave(true)">Save &amp; deploy</button></div><p id="terr" class="small" style="color:var(--bad)"></p>`);
  const out=[];for(const a of S.accounts){let ws=[];try{ws=await api(`/accounts/${a.id}/workspaces`)}catch{}
    out.push(`<div class="card" style="margin-bottom:12px"><div class="row"><div class="plat ${a.platform}">${a.platform==='slack'?'S':'D'}</div><b>${esc(a.label)}</b></div>${ws.map(w=>`<div class="ws" onclick="tch('${a.id}','${esc(w.id)}','${esc(w.name).replace(/'/g,'')}')"><span class="ic">${esc(w.icon)}</span><div><b>${esc(w.name)}</b><div class="mut small">${w.members.toLocaleString()} members</div></div></div><div id="tc-${a.id}-${esc(w.id)}"></div>`).join('')}</div>`)}
  $('#tp').innerHTML=out.join('')||'<div class="empty">Connect an account first.</div>';tcount()}
const tkey=t=>t.accountId+'|'+t.workspaceId+'|'+t.channelId;
async function tch(aid,wid,wname){const box=document.getElementById(`tc-${aid}-${wid}`);if(box.innerHTML){box.innerHTML='';return}
  const cs=await api(`/accounts/${aid}/workspaces/${wid}/channels`);
  box.innerHTML=`<div class="chlist">${cs.map(c=>{const t={accountId:aid,workspaceId:wid,channelId:c.id,label:`${wname} ${c.kind==='im'||c.kind==='mpim'?c.name:'#'+c.name}`};return`<label class="ch"><input type="checkbox" ${W.targets.some(x=>tkey(x)===tkey(t))?'checked':''} data-t='${esc(JSON.stringify(t))}'> ${c.kind==='im'||c.kind==='mpim'?'✉️ '+esc(c.name):'#'+esc(c.name)}<div class="sp"></div><span class="mut small">${c.members?c.members.toLocaleString():''}</span></label>`}).join('')}</div>`;
  box.querySelectorAll('input').forEach(i=>i.onchange=()=>{const t=JSON.parse(i.dataset.t);W.targets=W.targets.filter(x=>tkey(x)!==tkey(t));if(i.checked)W.targets.push(t);tcount()})}
const tcount=()=>{const e=$('#tc');if(e)e.textContent=`${W.targets.length} channel${W.targets.length===1?'':'s'} selected`};
async function wsave(deploy){try{await api(`/monitors/${W.mon.id}/targets`,{method:'PUT',body:{targets:W.targets}});if(deploy)await api(`/monitors/${W.mon.id}/deploy`,{method:'POST'});closeModal();S.view='monitors';load();if(deploy)toast('🟢 Monitor is now <b>Listening</b>')}catch(e){$('#terr').textContent=e.message}}

/* ---------- Alerts ---------- */
function rAlerts(){
  const tabs=[['new',`Unread (${S.stats.unread||0})`],['','All'],['bad_match','Skipped by the gate'],['archived','Archived']];
  $('#main').innerHTML=`<div class="row"><div><div class="k">// In-app inbox</div><h1>Alerts</h1><p class="sub">Every message that passed its monitor appears here.</p></div><div class="sp"></div><a class="btn" href="/api/alerts.csv" download>Export leads CSV</a></div>${statsBar()}
  <div class="tabs">${tabs.map(([v,l])=>`<button class="${S.filter===v?'on':''}" onclick="S.filter='${v}';load()">${l}</button>`).join('')}</div>
  <div id="alist">${S.alerts.length?S.alerts.map(alertCard).join(''):`<div class="empty">No alerts${S.filter?' in this view':' yet — deploy a monitor and they appear here within seconds'}.</div>`}</div>`}
const alertCard=a=>{const m=a.message;return`<div class="alert ${a.status}" id="al-${a.id}"><div class="row"><div class="plat ${m.source}">${m.source==='slack'?'S':'D'}</div><div><b>${esc(m.author.name)}</b> <span class="mut">in ${esc(m.workspace)} #${esc(m.channel)}</span><div class="mut small">${esc(a.monitorName)} · ${ago(m.ts)}</div></div><div class="sp"></div>${pill(a.status==='new'?'degraded':a.status,a.status==='new'?'New':a.status.replace('_',' '))}</div>
<div class="msg">${esc(m.text)}</div><div class="why">✓ ${esc(a.reason)}</div>
${a.replies.map(r=>`<div class="mut small" style="margin-top:6px">↳ You: ${esc(r.text)}</div>`).join('')}
<div class="row" style="margin-top:12px"><a class="btn sm" href="${esc(m.permalink)}" target="_blank" rel="noopener noreferrer">Open in ${m.source==='slack'?'Slack':'Discord'}</a><button class="btn sm pri" onclick="replyBox('${a.id}')">Message privately</button><button class="btn sm" onclick="setS('${a.id}','contacted')">Mark contacted</button><button class="btn sm" onclick="setS('${a.id}','read')">Mark read</button><button class="btn sm danger" onclick="setS('${a.id}','bad_match')">This should not have passed</button><button class="btn sm" onclick="setS('${a.id}','archived')">Archive</button></div><div id="rb-${a.id}"></div></div>`};
const setS=async(id,s)=>{await api('/alerts/'+id,{method:'PATCH',body:{status:s}});load()};
function replyBox(id){const b=$('#rb-'+id);b.innerHTML=`<div style="margin-top:10px"><textarea id="rt-${id}" placeholder="Write a message — sent manually, as you"></textarea><div class="row" style="margin-top:8px"><label class="small mut"><input type="checkbox" id="rd-${id}" checked> Send as DM</label><div class="sp"></div><button class="btn sm pri" onclick="sendReply('${id}')">Send</button></div></div>`}
async function sendReply(id){try{await api(`/alerts/${id}/reply`,{method:'POST',body:{text:$('#rt-'+id).value,dm:$('#rd-'+id).checked}});toast('Message sent');load()}catch(e){toast(esc(e.message))}}


async function aiModal(){const a=await api('/ai');
  modal(`<h2 style="margin-top:0">AI connection</h2><p class="mut">Used to judge whether a message really matches a monitor. Without it, the built-in rules are used.</p>
  <div class="verdict ${a.connected?'y':'n'}"><b>${a.connected?'✅ Connected':'Not connected'}</b>${a.connected?` via ${esc(a.method)}${a.plan?' · '+esc(a.plan)+' plan':''}`:''}</div>
  ${a.cliMissing?'<p class="small" style="color:var(--bad)">Claude Code CLI not found on this machine, use an API key instead.</p>':''}
  <label class="f">Sign in with your Claude account</label><p class="mut small" style="margin:0 0 8px">Opens a Claude sign-in window on the machine running this app. Uses your subscription, no key needed.</p>
  <button class="btn pri" id="aiLogin" ${a.cliMissing?'disabled':''}>${a.connected&&a.method==='Claude subscription'?'Sign in again':'Sign in with Claude'}</button> <span id="aiMsg" class="mut small"></span>
  <label class="f">Or paste an API key</label><div class="row">${pf('aiKey','sk-ant-…','flex:1')}<button class="btn" id="aiSave">Save</button>${a.method==='API key'?'<button class="btn danger" id="aiDel">Remove</button>':''}</div><p id="aiErr" class="small" style="color:var(--bad)"></p>
  <div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Close</button></div>`);
  $('#aiLogin').onclick=async()=>{await api('/ai/login',{method:'POST'});$('#aiMsg').textContent='Waiting for you to finish signing in…';const t=setInterval(async()=>{const s=await api('/ai');if(s.connected&&!s.loggingIn){clearInterval(t);load();aiModal()}},2000);setTimeout(()=>clearInterval(t),300000)};
  $('#aiSave').onclick=async()=>{try{await api('/ai/key',{method:'POST',body:{key:$('#aiKey').value}});load();aiModal()}catch(e){$('#aiErr').textContent=e.message}};
  if($('#aiDel'))$('#aiDel').onclick=async()=>{await api('/ai/key',{method:'DELETE'});load();aiModal()};
}

/* ---------- live ---------- */
let lastTop=null;
function maybeToast(){const a=S.alerts[0];if(lastTop!==null&&a&&a.id!==lastTop&&a.status==='new')toast(`🎯 <b>${esc(a.message.author.name)}</b> · ${esc(a.message.workspace)} #${esc(a.message.channel)}<div class="mut small">${esc(a.message.text.slice(0,110))}</div>`);if(a)lastTop=a.id;else if(lastTop===null)lastTop='';}
const _load=load;load=async function(){await _load();maybeToast()};
api('/stats').then(st=>{if(st.sse){const es=new EventSource('/api/events');['alert','account','account_removed','monitor','alert_updated'].forEach(ev=>es.addEventListener(ev,()=>{if(!$('#modal').classList.contains('show')&&!document.activeElement?.matches('textarea,input'))load()}))}});
setInterval(()=>{if(!document.hidden&&!$('#modal').classList.contains('show')&&!document.activeElement?.matches('textarea,input'))load()},5000);
const qp=new URLSearchParams(location.search);if(qp.get('connected')){setTimeout(()=>toast('✅ Connected '+esc(qp.get('connected'))+'. Pick your workspaces below.'),400)}if(qp.get('oauth')==='failed'){setTimeout(()=>toast('Sign-in did not complete. Try again.'),400)}if(qp.size)history.replaceState({},'','/');
load();
</script>
</body>
</html>
